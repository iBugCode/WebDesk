[package]
name = "webdesk"
version = "0.8.0"
edition = "2021"
description = "WebDesk - Web-first remote desktop agent for Xvfb (damage-driven, browser-rendered)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
x11rb = { version = "0.13", features = ["damage", "xfixes", "xtest", "shm"] }
zstd = "0.13"
webp = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.8"
libc = "0.2"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
